[workspace]
resolver = "3"
members = ["crates/feeder-core", "crates/feeder-cli", "crates/feeder-app"]

[workspace.package]
version = "0.5.15"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "allow"

[workspace.dependencies]
feeder-core = { path = "crates/feeder-core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd", default-features = false, features = [
  "accessibility",
  "metal-backend",
  "svg",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd", features = ["markdown", "mermaid"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
dirs = "7"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "337a06f38b6347ca47a51cbb24b994677d883ddd" }

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
