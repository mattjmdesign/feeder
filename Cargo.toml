[workspace]
resolver = "3"
members = ["crates/feeder-core", "crates/feeder-cli", "crates/feeder-app"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "allow"

[workspace.dependencies]
feeder-core = { path = "crates/feeder-core" }
# Only the Rune features Feeder uses: VoiceOver, Metal, and colour SVG icons. Its defaults also
# bundle Inter (Feeder uses SF Pro) and an Ogg/Opus decoder (Feeder plays no audio).
rune = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84", default-features = false, features = [
  "accessibility",
  "metal-backend",
  "svg",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84", features = ["markdown"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
dirs = "7"

# Rune's own `[patch.crates-io]` table, at the same rev. Cargo doesn't inherit patches from a
# dependency, so bump these together with `rune` above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "d170ff6e4a9691e3db0b0ad83e7e719b720afc84" }

# Debug builds leave out dependencies' debug info. Rune and its graphics stack were most of a
# 13 GB target/debug; Feeder's own crates keep full debug info for backtraces and debugging.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
# One codegen unit optimizes across the whole crate; only release builds pay the extra time.
codegen-units = 1
# Shipped binaries carry no symbol table. Panic messages keep their file and line.
strip = "symbols"
