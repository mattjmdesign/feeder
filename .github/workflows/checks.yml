name: Checks

# Runs only when started by hand (Actions → Checks → Run workflow). The checks in AGENTS.md run
# locally before every change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Check the Sparkle integration
        run: FEEDER_SPARKLE_DIR="$(scripts/fetch-sparkle.sh)" cargo clippy --locked -p feeder-app --all-targets -- -D warnings
